[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orx-analytics"
dynamic = ["version"]
description = "Read-only cross-project, cross-agent execution observability for ORX/zcode/Codex/Cursor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []  # stdlib only at runtime, by design
keywords = ["observability", "coding-agents", "analytics", "orx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/aderan/orx-analytics"
Repository = "https://github.com/aderan/orx-analytics"
Issues = "https://github.com/aderan/orx-analytics/issues"
Documentation = "https://github.com/aderan/orx-analytics#readme"

[project.scripts]
orx-analytics = "orxanalytics.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2"]

[tool.setuptools.dynamic]
version = {attr = "orxanalytics.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["orxanalytics*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
