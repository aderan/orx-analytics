name: Tests and installation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: macos-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install development requirements
        run: python -m pip install -e '.[dev]'
      - name: Run deterministic source tests
        run: python -m pytest -o addopts= -q
      - name: Verify source archive and clean wheel installation
        run: python scripts/check_install.py
